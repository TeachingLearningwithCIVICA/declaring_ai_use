GROUPS.forEach(gr => {
  const head = document.createElement("div"); head.className = "ghead";
  head.innerHTML = '<span class="gl" aria-hidden="true">' + gr.g + '</span><span><b>' + esc(gr.name) + '</b>' + (gr.hint ? '<span class="small">' + esc(gr.hint) + '</span>' : '') + '</span>';
  catsEl.appendChild(head);
  gr.items.forEach(item => {
    const c = CATS.find(x => x.id === item.id);
    const w = document.createElement("div"); w.className = "cat";
    w.innerHTML = '<label for="c' + c.id + '"><input type="checkbox" id="c' + c.id + '" value="' + c.id + '"><span class="cid">' + c.id + '</span><span><span class="ct">' + esc(c.t) + (c.added ? ' <span class="newtag">' + esc(T.suggestedAddition) + '</span>' : '') + '</span><span class="cd">' + esc(c.d) + '</span></span></label>'
      + (c.none ? '' : '<div class="more" hidden><div><label class="f" for="tool' + c.id + '">' + esc(T.toolUsed) + '</label><input type="text" id="tool' + c.id + '" placeholder="' + esc(T.toolPlaceholder) + '"></div><div><label class="f" for="how' + c.id + '">' + esc(T.howLabel) + '</label><textarea id="how' + c.id + '" rows="2" placeholder="' + esc(T.howPlaceholder) + '"></textarea></div></div>');
    catsEl.appendChild(w);
    const cb = w.querySelector("input[type=checkbox]");
    cb.addEventListener("change", () => {
      const more = w.querySelector(".more"); if (more) more.hidden = !cb.checked;
      if (cb.checked){
        if (c.none){ CATS.filter(x => !x.none).forEach(x => { const o = $("c" + x.id); o.checked = false; o.closest(".cat").querySelector(".more").hidden = true; }); }
        else { $("c" + NONE_ID).checked = false; }
      }
      $("catErr").hidden = true;
    });
  });
});
/* Prefill a realistic example */
Object.keys(T.prefill).forEach(id => { $("c" + id).checked = true; $("c" + id).closest(".cat").querySelector(".more").hidden = false; $("tool" + id).value = T.prefill[id][0]; $("how" + id).value = T.prefill[id][1]; });

const panes = ["p1","p2","p3"];
/* Moving between steps hides the button that was pressed, so focus moves
   to the new step's heading instead of being lost. */
function show(n, moveFocus){
  panes.forEach((p, i) => $(p).hidden = i !== n);
  ["st1","st2","st3"].forEach((s, i) => $(s).classList.toggle("on", i === n));
  if (moveFocus) $("h-" + panes[n]).focus();
}
$("to2").addEventListener("click", () => show(1, true));
$("back1").addEventListener("click", () => show(0, true));
$("back2").addEventListener("click", () => show(1, true));
$("restart").addEventListener("click", () => {
  CATS.forEach(c => { $("c" + c.id).checked = false; const m = $("c" + c.id).closest(".cat").querySelector(".more"); if (m){ m.hidden = true; $("tool" + c.id).value = ""; $("how" + c.id).value = ""; } });
  show(0, true);
});

/* Short check value so a mistyped or invented code is noticeable */
function checkValue(str){ let h = 0; for (const ch of str) h = (h * 31 + ch.charCodeAt(0)) % 1296; return h.toString(36).toUpperCase().padStart(2, "0"); }

let plainStatement = "";
$("to3").addEventListener("click", () => {
  const sel = CATS.filter(c => $("c" + c.id).checked);
  if (!sel.length){ $("catErr").hidden = false; return; }
  const course = ($("aCourse").value.trim() || "COURSE").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const core = sel.map(c => c.id).join(".");
  const code = core + "-" + checkValue(course + core);
  const title = $("aTitle").value.trim() || T.stmtFallbackTitle;
  const headLine = fill(T.stmtHead, { title });
  let html = '<p><b>' + esc(headLine) + '</b>' + (course ? ' (' + esc(course) + ')' : '') + '</p>';
  let plain = headLine + (course ? ' (' + course + ')' : '') + '\n';
  GROUPS.forEach(gr => {
    const inG = sel.filter(c => c.group === gr.g); if (!inG.length) return;
    if (gr.g !== "N"){ html += '<p class="sg">' + esc(gr.name) + '</p>'; plain += '\n' + gr.name + '\n'; }
    inG.forEach(c => {
      let extra = "";
      if (!c.none){
        const tool = $("tool" + c.id).value.trim(), how = $("how" + c.id).value.trim();
        if (tool) extra += fill(T.stmtTool, { tool });
        if (how) extra += ' ' + (/[.!?]$/.test(how) ? how : how + '.');
      }
      html += '<p><span class="sid">' + c.id + '</span> ' + esc(c.s + extra) + '</p>'; plain += c.id + ' ' + c.s + extra + '\n';
    });
  });
  const none = sel.some(c => c.none);
  const closing = none ? T.closingNone : T.closingUsed;
  html += '<p>' + esc(closing) + '</p>'; plain += '\n' + closing + '\n' + fill(T.codeLine, { code });

  /* Gentle consistency prompts for the student */
  const has = p => sel.some(c => c.id.startsWith(p));
  const notes = [];
  if ((has("G") || $("cC5").checked) && !has("R")) notes.push(T.noteNoRevision);
  if (has("R") && !has("G") && !$("cC5").checked) notes.push(T.noteRevisionOnly);
  if ($("cI5").checked) notes.push(T.noteSources);
  $("outNotes").innerHTML = notes.map(n => '<li>' + esc(n) + '</li>').join("");
  $("outNotes").hidden = !notes.length;

  $("outCode").textContent = code; $("outStatement").innerHTML = html; plainStatement = plain;
  $("decode").innerHTML = rich(fill(T.decode, { check: code.slice(-2) }));
  $("copyMsg").textContent = "";
  show(2, true);
});

function copy(text, label){
  const blocked = () => { $("copyMsg").textContent = T.copyBlocked; };
  const done = () => { $("copyMsg").textContent = fill(T.copied, { label }); };
  try { navigator.clipboard.writeText(text).then(done, blocked); } catch (e) { blocked(); }
}
$("copyCode").addEventListener("click", () => copy($("outCode").textContent, T.copyCodeLabel));
$("copyStmt").addEventListener("click", () => copy(plainStatement, T.copyStmtLabel));

/* ===== Readiness self-check (the author's logic) ===== */
const QS = T.questions;
const ANS = { yes:T.answerYes, no:T.answerNo, unsure:T.answerUnsure };
const checkEl = $("check");
QS.forEach((q, i) => {
  const r = document.createElement("div"); r.className = "qrow";
  r.innerHTML = '<p id="ql' + q.id + '">' + (i + 1) + '. ' + esc(q.q) + '</p><div class="seg" role="radiogroup" aria-labelledby="ql' + q.id + '">'
    + ["yes","no","unsure"].map(v => '<label><input type="radio" name="r' + q.id + '" id="r' + q.id + v + '" value="' + v + '"' + (v === "unsure" ? ' checked' : '') + '>' + esc(ANS[v]) + '</label>').join("") + '</div>';
  checkEl.appendChild(r);
});
function evalCheck(){
  const items = QS.map(q => q.a[(document.querySelector('input[name="r' + q.id + '"]:checked') || {}).value || "unsure"]);
  const order = { stop:0, care:1, ok:2 };
  items.sort((a, b) => order[a[0]] - order[b[0]]);
  const stops = items.filter(x => x[0] === "stop").length, cares = items.filter(x => x[0] === "care").length;
  $("verdict").textContent = stops ? (stops > 1 ? fill(T.verdictStopN, { n:stops }) : T.verdictStop1)
    : cares ? (cares > 1 ? fill(T.verdictCareN, { n:cares }) : T.verdictCare1)
    : T.verdictOk;
  const label = { stop:T.pillStop, care:T.pillCare, ok:T.pillOk };
  $("advice").innerHTML = items.map(x => '<li class="' + x[0] + '"><span class="pill">' + esc(label[x[0]]) + '</span><span><b>' + esc(x[1]) + '.</b> ' + esc(x[2]) + '</span></li>').join("");
}
checkEl.addEventListener("change", evalCheck);
/* Example state so the result is meaningful at first view */
[["pol","yes"],["perm","yes"],["res","no"],["brief","yes"],["resp","unsure"],["teach","yes"],["data","yes"]].forEach(([id, v]) => { $("r" + id + v).checked = true; });
evalCheck();

/* ===== CIVICA frame ===== */
$("t-skip").textContent = T.skip;
$("t-mark").setAttribute("aria-label", T.markLabel);
$("t-mark-sub").textContent = T.markSub;
$("t-lbl-author").textContent = T.lblAuthor; $("t-lbl-published").textContent = T.lblPublished;
$("t-lbl-part").textContent = T.lblPart; $("t-lbl-licence").textContent = T.lblLicence;
$("t-newtab-1").textContent = T.newTab; $("t-funding").textContent = T.funding;
$("t-licence").innerHTML = esc(T.licence).replace("{link}", '<a href="' + LICENCE_URL + '" target="_blank" rel="noopener noreferrer license">' + esc(LICENCE_NAME) + '<span class="sr-only">' + esc(T.newTab) + '</span></a>');
const pd = $("published-date"); pd.setAttribute("datetime", PUBLISHED);
pd.textContent = new Intl.DateTimeFormat("en-GB", { day:"numeric", month:"long", year:"numeric", timeZone:"UTC" }).format(new Date(PUBLISHED + "T12:00:00Z"));

const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.4M12 19.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/></svg>';
function updateThemeButton(){
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme-icon").innerHTML = dark ? SUN : MOON;
  $("theme-label").textContent = dark ? T.themeToLight : T.themeToDark;
  $("theme-btn").setAttribute("aria-pressed", String(dark));
  $("theme-btn").setAttribute("aria-label", dark ? T.themeToLightLabel : T.themeToDarkLabel);
}
$("theme-btn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  updateThemeButton();
});
updateThemeButton();
})();
</script>
